<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Twin Read</title>
    <style>
      body {
        min-width: 230px;
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 10px;
      }
      button {
        width: 100%;
        padding: 8px 0;
        font-size: 14px;
        border: none;
        border-radius: 6px;
        background: #e84393;
        color: #fff;
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        background: #d63384;
      }
      button:disabled {
        background: #ccc;
        cursor: default;
      }
      #status {
        font-size: 12px;
        color: #666;
        margin: 8px 0 0;
        min-height: 1em;
      }
      #open-options {
        display: block;
        font-size: 12px;
        color: #888;
        margin-top: 8px;
        text-align: center;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <h1>Twin Read</h1>
    <button id="toggle" disabled>开启整页翻译</button>
    <p id="status">读取中…</p>
    <a id="open-options" href="#">模型设置</a>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
